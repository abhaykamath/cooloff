[build]
  base    = "/"
  command = "pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to Render so the session cookie stays first-party.
[[redirects]]
  from   = "/api/*"
  to     = "https://cooloff-api.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback for React Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
