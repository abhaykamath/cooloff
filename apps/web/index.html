<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color" content="#edf1f3" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme (light / dark / system) before first paint — no flash.
      // Keep in sync with src/lib/theme.ts.
      (function () {
        var m = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          var pref = 'system';
          try { pref = localStorage.getItem('cooloff-theme') || 'system'; } catch (e) {}
          var dark = pref === 'dark' || (pref === 'system' && m.matches);
          document.documentElement.classList.toggle('dark', dark);
          document.getElementById('theme-color').setAttribute('content', dark ? '#0f1a22' : '#edf1f3');
        };
        apply();
        m.addEventListener('change', apply);
      })();
    </script>
    <title>Cooloff</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
